[project]
name = "dersnotu"
version = "0.1.0"
description = "Ders slaytlarını kitapla besleyip anlaşılır, detaylı ders notu PDF'ine dönüştürür"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    # Render hattı: Markdown → HTML → PDF
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "pygments>=2.18",
    "playwright>=1.49",
    # Web arayüzü + API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.hatch.build.targets.wheel.force-include]
"src/dersnotu/assets" = "dersnotu/assets"

[project.scripts]
dersnotu = "dersnotu.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dersnotu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: gerçek PDF okur / Chromium çalıştırır"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer'ın standart deyimi argüman varsayılanında fonksiyon çağırmaktır.
ignore = ["E501", "B008"]
