<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dersnotu — derslerim</title>
<link rel="stylesheet" href="/static/app.css">
<style>
/* Ana sayfa tek sütun: burada bir iş çalışmıyor, ilerleme rayı yok. */
main{display:block;padding:32px 0 90px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}

/* Ders kartı bir fiş: üstte künye (kod), altta ad, en altta sayım.
   Kart tıklanınca derse girilir; silme ayrı bir düğme çünkü aynı kartın
   içinde iki farklı sonuç olan tek bir tıklama alanı olmamalı. */
.card{position:relative;display:flex;flex-direction:column;min-height:158px;
      background:var(--surface);border:1px solid var(--rule);border-radius:5px;
      padding:18px 20px 16px;text-decoration:none;color:inherit;
      transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink);transform:translateY(-1px)}
/* Künye satırı: kod varsa .kod etiketi (app.css), yoksa sade "ders" yazısı. */
.card .code{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
      text-transform:uppercase;color:var(--muted);margin-bottom:10px;
      min-height:20px}
.card .nm{font-size:19px;line-height:1.25;font-weight:600;letter-spacing:-.01em;
      margin:0 0 auto;padding-right:22px;word-break:break-word}
.card .note{font-size:12.5px;color:var(--muted);margin:6px 0 0;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .counts{font-family:var(--mono);font-size:10.5px;color:var(--muted);
      margin-top:16px;padding-top:11px;border-top:1px solid var(--rule)}
.card .counts b{color:var(--ink);font-weight:600}
.card .x{position:absolute;top:12px;right:11px;width:24px;height:24px;padding:0;
      background:transparent;color:var(--muted);border:none;border-radius:3px;
      font-size:16px;line-height:1;cursor:pointer;opacity:0;transition:opacity .12s}
.card:hover .x,.card .x:focus-visible{opacity:1}
.card .x:hover{color:var(--danger);background:var(--paper)}

/* Yeni ders kartı listenin parçası, ayrı bir bölge değil: "ders eklemek"
   de derslerden biri gibi görünsün. */
.new{border-style:dashed;justify-content:center;align-items:center;color:var(--muted);
     font-size:14px;background:transparent;cursor:pointer;width:100%;font-weight:400;
     min-height:158px;border-width:1.5px;border-color:var(--rule);border-radius:5px;
     padding:18px;transition:border-color .15s,color .15s}
.new:hover{border-color:var(--ink);color:var(--ink)}

dialog{border:1px solid var(--rule);border-radius:6px;background:var(--surface);
       color:var(--ink);padding:26px 28px;max-width:420px;width:calc(100% - 40px)}
dialog::backdrop{background:rgba(20,22,26,.45)}
dialog h2{margin:0 0 18px;font-size:20px;font-weight:600;letter-spacing:-.01em}
dialog .field{margin-bottom:14px}
dialog .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
dialog .foot button{padding:11px 20px;font-size:14px}
.hint{font-size:12px;color:var(--muted);margin:5px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">dersnotu</div>
    <h1>Slaytlar üç madde. Kitap bin sayfa. <span class="hl">Arası boş.</span></h1>
    <p class="lede">Her ders için slaytlarını ve kitabını bir kez yükle. Sistem
       slaytın kapsamını korur, açıklamayı kitaptan çeker ve her iddiaya kaynak koyar.</p>
  </header>

  <main>
    <div class="panel-head" style="margin-bottom:18px">
      <h2 style="font-size:17px;margin:0;font-weight:600">Derslerim</h2>
      <span class="lab" id="say" style="margin:0"></span>
    </div>
    <div class="cards" id="cards"></div>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" id="newform">
    <h2>Yeni ders</h2>
    <div class="field">
      <span class="lab">Ders adı</span>
      <input type="text" name="name" required maxlength="120"
             placeholder="Bilgisayar Sistemlerine Giriş" autocomplete="off">
    </div>
    <div class="field">
      <span class="lab">Ders kodu</span>
      <input type="text" name="code" maxlength="24" placeholder="BLG 212" autocomplete="off">
      <p class="hint">İsteğe bağlı. Listede künye olarak görünür.</p>
    </div>
    <div class="field">
      <span class="lab">Not</span>
      <input type="text" name="note" maxlength="200" placeholder="2. sınıf güz dönemi"
             autocomplete="off">
    </div>
    <div class="foot">
      <button type="button" class="ghost" id="iptal">Vazgeç</button>
      <button type="submit" id="olustur">Dersi oluştur</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const cardsEl = $("#cards"), dlg = $("#dlg");

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function cardHTML(c){
  const n = c.counts;
  const kunye = c.code ? `<span class="kod">${esc(c.code)}</span>` : "ders";
  // Sıfır sayımı göstermek yeni bir dersi "boş" diye damgalar; onun yerine
  // ne yapılacağını söyle.
  const sayim = (n.lectures + n.books + n.documents) === 0
    ? "henüz dosya yok"
    : [n.lectures && `<b>${n.lectures}</b> slayt`,
       n.books && `<b>${n.books}</b> kitap`,
       n.documents && `<b>${n.documents}</b> ders notu`].filter(Boolean).join(" · ");
  return `<a class="card" href="/ders/${c.id}">
    <button class="x" type="button" data-del="${c.id}" data-name="${esc(c.name)}"
            title="Dersi sil" aria-label="Dersi sil">×</button>
    <div class="code">${kunye}</div>
    <h3 class="nm">${esc(c.name)}</h3>
    ${c.note ? `<p class="note">${esc(c.note)}</p>` : ""}
    <div class="counts">${sayim}</div>
  </a>`;
}

function ciz(list){
  $("#say").textContent = list.length ? `${list.length} ders` : "";
  cardsEl.innerHTML = list.map(cardHTML).join("")
    + `<button class="new" id="yeni">+ Yeni ders</button>`;
  $("#yeni").addEventListener("click", () => {
    $("#newform").reset(); dlg.showModal();
  });
  for (const b of cardsEl.querySelectorAll("[data-del]"))
    b.addEventListener("click", sil);
}

// Sayfa her istekte diskten okunuyor, uçlar ise süreçte donmuş durumda.
// Yani ESKİ bir sunucu YENİ bir sayfayı sunabiliyor — ucu bulamayan istemci
// hiçbir şey çizmezse geriye bomboş bir ekran kalır ve kullanıcı neyin
// bozulduğunu bilemez. Sessiz başarısızlık burada yasak.
function hata(baslik, ipucu){
  $("#say").textContent = "";
  cardsEl.innerHTML = `<div class="err" style="grid-column:1/-1">
    <b>${esc(baslik)}</b>${ipucu ? `<br>${ipucu}` : ""}</div>`;
}

async function load(){
  let r;
  try {
    r = await fetch("/api/courses");
  } catch {
    hata("Sunucuya ulaşılamadı.", "Sunucu kapalı olabilir — terminalde "
      + "<code>dersnotu serve</code> ile başlat.");
    return;
  }
  if (r.status === 404) {
    hata("Çalışan sunucu bu sayfadan eski.",
      "Ders kitaplığı uçları bu süreçte yok. Terminalde sunucuyu durdurup "
      + "yeniden başlat (<code>Ctrl+C</code>, sonra <code>dersnotu serve</code>). "
      + "Geliştirirken <code>--reload</code> eklersen bu bir daha olmaz.");
    return;
  }
  if (!r.ok) { hata(`Ders listesi alınamadı (HTTP ${r.status}).`); return; }
  const list = await r.json();
  if (!Array.isArray(list)) { hata("Sunucudan beklenmeyen yanıt geldi."); return; }
  ciz(list);
}

async function sil(e){
  // Kart bir <a>; silme düğmesi onun içinde. Durdurulmazsa hem onay çıkar
  // hem de derse gidilir.
  e.preventDefault(); e.stopPropagation();
  const { del: id, name } = e.currentTarget.dataset;
  const c = await (await fetch(`/api/courses/${id}`)).json();
  const n = c.counts;
  const ne = [n.lectures && `${n.lectures} slayt`, n.books && `${n.books} kitap`,
              n.documents && `${n.documents} ders notu`].filter(Boolean).join(", ");
  const mesaj = `"${name}" dersi silinsin mi?`
    + (ne ? `\n\nBirlikte silinecekler: ${ne}.` : "")
    + "\n\nBu geri alınamaz.";
  if (!confirm(mesaj)) return;
  const r = await fetch(`/api/courses/${id}`, { method: "DELETE" });
  if (!r.ok) { alert("Silinemedi: " + r.statusText); return; }
  load();
}

$("#iptal").addEventListener("click", () => dlg.close());

$("#newform").addEventListener("submit", async e => {
  // method="dialog" formu kapatır; gönderimi biz yapıyoruz.
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = $("#olustur");
  btn.disabled = true; btn.textContent = "Oluşturuluyor…";
  try {
    const r = await fetch("/api/courses", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: fd.get("name"), code: fd.get("code"), note: fd.get("note"),
      }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const c = await r.json();
    dlg.close();
    // Yeni ders boş; kullanıcının oradaki işi dosya yüklemek. Doğrudan götür.
    location.href = `/ders/${c.id}`;
  } catch (err) {
    alert(err.message);
    btn.disabled = false; btn.textContent = "Dersi oluştur";
  }
});

load();
</script>
</body>
</html>
